<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://epslwaxjemlysqtubbfu.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Confirmar entrega | HAUSLINE</title>
  <meta name="theme-color" content="#F7F3EC">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#F7F3EC;color:#171310;font-family:Jost,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 16px 40px}
    .caja{width:100%;max-width:460px}
    .logo{text-align:center;font:600 20px/1 Jost,sans-serif;letter-spacing:6px;margin:6px 0 22px}
    .tarjeta{background:#fff;border:1px solid #E7E3DC;border-radius:18px;padding:24px 20px;box-shadow:0 10px 30px rgba(23,19,16,.05)}
    .kicker{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#6B655C;font-weight:600}
    h1{font:600 30px/1.15 "Cormorant Garamond",Georgia,serif;margin:6px 0 4px}
    .sub{font-size:14px;color:#6B655C;line-height:1.5}
    .campo{margin-top:14px}
    .campo label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
    .campo input,.campo select{width:100%;border:1px solid #E7E3DC;border-radius:12px;padding:13px 12px;font:16px Jost,sans-serif;color:#171310;background:#fff;outline:none}
    .campo input:focus,.campo select:focus{border-color:#171310}
    .resumen{margin-top:18px;border-top:1px solid #EFEBE4;padding-top:14px;font-size:14px}
    .fila{display:flex;justify-content:space-between;gap:10px;padding:5px 0;color:#4a443c}
    .fila b{color:#171310}
    .fila.total{font-size:16px;border-top:1px dashed #E7E3DC;margin-top:6px;padding-top:10px}
    .nota{font-size:12px;color:#9C958A;margin-top:6px;line-height:1.45}
    .btn{display:block;width:100%;margin-top:18px;border:0;border-radius:12px;padding:15px;font:600 15px Jost,sans-serif;letter-spacing:.5px;cursor:pointer;background:#171310;color:#F7F3EC;text-align:center;text-decoration:none}
    .btn.sec{background:transparent;color:#171310;border:1px solid #171310;margin-top:10px}
    .btn:disabled{opacity:.55;cursor:wait}
    .error{margin-top:12px;font-size:13px;color:#b42318}
    .ok{text-align:center}
    .ok .icono{font-size:42px}
    .oculto{display:none}
  </style>
</head>
<body>
  <main class="caja">
    <div class="logo">HAUSLINE</div>
    <section class="tarjeta" id="tarjeta"><p class="sub">Cargando tu pedido…</p></section>
  </main>
  <script src="config.js?v=20261002c10"></script>
  <script src="entrega/entrega.js?v=20261002"></script>
</body>
</html>
