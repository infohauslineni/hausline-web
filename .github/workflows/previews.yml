name: Generar previews /p

# Regenera las mini-páginas para compartir (/p/<CODIGO>/index.html) cada vez
# que cambie el catálogo. Así los productos NUEVOS obtienen su enlace con
# vista previa (foto en WhatsApp/Facebook) sin correr nada a mano.
#
# El commit del bot solo toca /p/**, que NO está en "paths", por lo que no se
# vuelve a disparar a sí mismo (sin bucles). También se puede correr a mano
# desde la pestaña Actions con "Run workflow" (por ejemplo, para rellenar los
# productos que hoy no tienen preview).

on:
  push:
    branches: [main]
    paths:
      - 'productos.js'
      - 'scripts/gen-og.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas /p
        run: node scripts/gen-og.mjs

      - name: Subir cambios si los hay
        run: |
          git config user.name "hausline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p
          if git diff --cached --quiet; then
            echo "Sin cambios en /p — nada que subir."
          else
            git commit -m "Auto: regenera páginas de preview /p [skip ci]"
            git push
          fi
