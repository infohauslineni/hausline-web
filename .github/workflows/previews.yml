name: Generar previews /p

# Regenera las mini-páginas para compartir (/p/<CODIGO>/index.html) para TODO
# el catálogo: los productos de productos.js Y los agregados desde el panel
# (Supabase · catalogo_web). Así cada producto obtiene su enlace con vista
# previa (foto en WhatsApp/Facebook) sin correr nada a mano.
#
# Se dispara de 4 formas:
#   1. push que cambie productos.js o el generador (cambios en el código).
#   2. schedule: cada 15 minutos, para recoger los productos que se agregan
#      desde el panel (esos guardan en Supabase, NO hacen push, así que sin
#      horario nunca tendrían preview). Así un producto nuevo del panel obtiene
#      su foto de WhatsApp solo, en ~15 min máximo, sin correr nada a mano.
#      El commit del bot solo se hace si hay cambios (runs vacíos = no-op).
#   3. workflow_dispatch: botón "Run workflow" para forzarlo al instante.
#   4. repository_dispatch (tipo "nuevo-producto"): para disparo INSTANTÁNEO.
#      Si algún día se conecta un Webhook de Supabase (al insertar en
#      catalogo_web) que llame a la API de GitHub, el preview se genera al
#      momento. Mientras no exista el webhook, este trigger simplemente no se
#      usa; el cron de cada 15 min ya lo cubre.
#
# Repo público ⇒ minutos de Actions gratis, por eso el cron corto no cuesta.
# El commit del bot solo toca /p/** y sitemap.xml, que NO están en "paths", por
# lo que no se vuelve a disparar a sí mismo (sin bucles).

on:
  push:
    branches: [main]
    paths:
      - 'productos.js'
      - 'scripts/gen-og.mjs'
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos (UTC)
  workflow_dispatch:
  repository_dispatch:
    types: [nuevo-producto]

permissions:
  contents: write

concurrency:
  group: previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas /p
        run: node scripts/gen-og.mjs

      - name: Subir cambios si los hay
        run: |
          git config user.name "hausline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en /p ni sitemap — nada que subir."
          else
            git commit -m "Auto: regenera páginas /p y sitemap [skip ci]"
            git push
          fi
