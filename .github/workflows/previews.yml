name: Generar previews /p

# Regenera las mini-páginas para compartir (/p/<CODIGO>/index.html) para TODO
# el catálogo: los productos de productos.js Y los agregados desde el panel
# (Supabase · catalogo_web). Así cada producto obtiene su enlace con vista
# previa (foto en WhatsApp/Facebook) sin correr nada a mano.
#
# Se dispara de 3 formas:
#   1. push que cambie productos.js o el generador (cambios en el código).
#   2. schedule: cada 2 horas, para recoger los productos que se agregan desde
#      el panel (esos guardan en Supabase, NO hacen push, así que sin horario
#      nunca tendrían preview). El commit del bot solo se hace si hay cambios.
#   3. workflow_dispatch: botón "Run workflow" para forzarlo al instante.
#
# El commit del bot solo toca /p/**, que NO está en "paths", por lo que no se
# vuelve a disparar a sí mismo (sin bucles).

on:
  push:
    branches: [main]
    paths:
      - 'productos.js'
      - 'scripts/gen-og.mjs'
  schedule:
    - cron: '0 */2 * * *'   # cada 2 horas (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas /p
        run: node scripts/gen-og.mjs

      - name: Subir cambios si los hay
        run: |
          git config user.name "hausline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p
          if git diff --cached --quiet; then
            echo "Sin cambios en /p — nada que subir."
          else
            git commit -m "Auto: regenera páginas de preview /p [skip ci]"
            git push
          fi
